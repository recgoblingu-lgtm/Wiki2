name: Auto Wiki Generator

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Articles
        run: |
          node generate.js

      - name: Commit changes
        run: |
          git config user.name "wiki-bot"
          git config user.email "bot@wiki.com"
          git add .
          git commit -m "Auto articles" || echo "No changes"
          git push