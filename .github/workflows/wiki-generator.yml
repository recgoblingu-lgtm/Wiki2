name: Grow Wiki2

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted recurring execution; individual runs create one article.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: wiki-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Wiki2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate one unique article
        run: python generator.py --once

      - name: Commit and push the new article
        run: |
          git config user.name "wiki2-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ .wiki-generated.json index.html
          if git diff --cached --quiet; then
            echo "No new article was created; nothing to commit."
            exit 0
          fi
          git commit -m "Grow Wiki2 with a new encyclopedia article"
          git push
