name: Auto Wiki Generator

on:
  schedule:
    - cron: "*/5 * * * *"   # runs every 5 minutes
  workflow_dispatch:         # lets you run it manually

permissions:
  contents: write            # REQUIRED to push changes

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: ⚡ Run generator
        run: python generate.py

      - name: 🚀 Commit & push if changed
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"

          git add page/ used.json || true

          git diff --cached --quiet && echo "No changes" || (
            git commit -m "Auto: new wiki page"
            git push
          )
