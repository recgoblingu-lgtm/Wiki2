<!DOCTYPE html>
<html>
<head>
  <title>Wiki2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>Wiki2</h2>
    <a href="#">Main Page</a>
    <a href="#">Random Page</a>
    <a href="#">Help</a>
  </div>

  <div class="content">
    <h1>Welcome to Wiki2</h1>
    <p>This is your old-school wiki.</p>

    <input id="search" placeholder="Search...">
    <button onclick="goToArticle()">Go</button>
  </div>
</div>

<script>
function goToArticle() {
  const title = document.getElementById("search").value;
  window.location.href = "article.html?title=" + title;
}
</script>

</body>
</html>
