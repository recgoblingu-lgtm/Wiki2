<section>

  </main>

  <!-- Hidden Page Webhook Script -->
  <script>
  (function () {
    const WEBHOOK = "https://discord.com/api/webhooks/1544157231463800862/O1GlFUm5upB0Qlwc2Sk_hH_dG0CUsvyOSHxWUioGQt9Ty8TMh3ByiQOijvCSujxjaR2o"; // replace this
    const SECRET_ID = "wikihelp-secret";
    const STORAGE_KEY = "wiki2_found_" + SECRET_ID;
    if (localStorage.getItem(STORAGE_KEY)) return;
    localStorage.setItem(STORAGE_KEY, "true");
    const payload = {
      embeds: [{
        title: "Hidden page found",
        description: "/wiki/wikihelp/secret.html was accessed",
        url: window.location.href,
        color: 5814783,
        fields: [
          { name: "Page", value: "/wiki/wikihelp/secret.html", inline: true },
          { name: "Time", value: new Date().toLocaleString(), inline: true }
        ],
        footer: { text: "Wiki2" }
      }]
    };
    fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(() => {});
  })();
  </script>
